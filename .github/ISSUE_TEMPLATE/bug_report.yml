name: Bug report
description: Tell me what happened in the free beta
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Thanks for trying Continua. Do not include passwords, API keys, licence keys, or private project content. Redact screenshots and logs."
  - type: input
    id: versions
    attributes:
      label: App, macOS and Codex Desktop versions
      placeholder: "Continua 0.1.0 (2), macOS …, Codex Desktop …"
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshot or diagnostic summary
      description: "Please inspect anything you share for private information first."
